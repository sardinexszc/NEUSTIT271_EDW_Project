name: driw
version: "1.0.0"
config-version: 2
profile: driw

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  driw:
    staging:
      +schema: staging
      +materialized: table
    dq:
      +schema: dq
      +materialized: table

seeds:
  driw:
    +schema: dq
