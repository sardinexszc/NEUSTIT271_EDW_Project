    description: Landing zone, loaded by ingestion/load_raw.py. All business columns are text.
    tables:
      - name: pagasa_event
      - name: ndrrmc_damage_report
      - name: ndrrmc_lifeline_status
      - name: dromic_evacuation
      - name: dromic_displaced_outside
      - name: ngo_distribution
