<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14233A"/></marker></defs><rect x="0" y="0" width="1300" height="800" rx="8" fill="#F6F4EF" stroke="#F6F4EF" stroke-width="1.2"/><text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#14233A" text-anchor="start" font-weight="700">Conceptual model: business processes and the entities they involve</text><text x="24" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">Each process becomes a fact table; each entity becomes a dimension. Entities in the centre are shared (conformed) across processes.</text><rect x="515" y="238" width="270" height="374" rx="14" fill="#ECE8DF" stroke="#ECE8DF" stroke-width="1.2"/><text x="650.0" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="middle" font-weight="700">Shared conformed dimensions</text><rect x="535" y="276" width="230" height="50" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="650.0" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#14233A" text-anchor="middle" font-weight="700">Hazard event</text><rect x="535" y="344" width="230" height="50" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="650.0" y="375" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#14233A" text-anchor="middle" font-weight="700">Location (PSGC)</text><rect x="535" y="412" width="230" height="50" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="650.0" y="443" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#14233A" text-anchor="middle" font-weight="700">Date</text><rect x="535" y="480" width="230" height="50" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="65