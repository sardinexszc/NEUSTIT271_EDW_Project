<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14233A"/></marker></defs><rect x="0" y="0" width="1500" height="760" rx="8" fill="#F6F4EF" stroke="#F6F4EF" stroke-width="1.2"/><text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#14233A" text-anchor="start" font-weight="700">ETL workflow: from five source systems to the dashboards</text><text x="24" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">Orchestrated by ingestion/pipeline.py (migrate → reference → psgc → generate → raw → dbt → export); every push re-runs it in GitHub Actions.</text><rect x="30" y="100" width="200" height="62" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="44" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14233A" text-anchor="start" font-weight="700">NDRRMC sitreps</text><text x="44" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">CSV: damage, lifelines</text><path d="M230,131 C265.0,131 265.0,300 300,300" fill="none" stroke="#B8B2A3" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="182" width="200" height="62" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="44" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14233A" text-anchor="start" font-weight="700">DSWD DROMIC</text><text x="44" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">Excel: inside + outside ECs</text><path d="M230,213 C265.0,213 265.0,300 300,300" fill="none" stroke="#B8B2A3" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="264" width="200" height="62" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="44" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14233A" text-anchor="start" font-weight="700">NGO / LGU relief</text><text x="44" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">nested JSON</text><path d="M230,295 C265.0,295 265.0,300 300,300" fill="none" stroke="#B8B2A3" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="346" width="200" height="62" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="44" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14233A" text-anchor="start" font-weight="700">PAGASA bulletins</text><text x="44" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">CSV</text><path d="M230,377 C265.0,377 265.0,300 300,300" fill="none" stroke="#B8B2A3" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="428" width="200" height="62" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.2"/><text x="44" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14233A" text-anchor="start" font-weight="700">LGU response logs</text><text x="44" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">CSV</text><path d="M230,459 C265.0,459 265.0,300 300,300" fill="none" stroke="#B8B2A3" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="300" y="230" width="230" height="150" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.4"/><text x="314" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14233A" text-anchor="start" font-weight="700">1 · Extract</text><text x="314" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">load_raw.py</text><text x="314" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">files → raw.* as text</text><text x="314" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">batch id, file, row no.</text><text x="314" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">→ meta.load_batch</text><rect x="300" y="430" width="230" height="120" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.4"/><text x="314" y="456" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14233A" text-anchor="start" font-weight="700">Reference data</text><text x="314" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">load_psgc_api.py (PSGC)</text><text x="314" y="499" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">load_reference.py</text><text x="314" y="518" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">→ ref.*</text><line x1="530" y1="305" x2="590" y2="305" stroke="#14233A" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="530" y1="490" x2="640" y2="412" stroke="#14233A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="590" y="200" width="270" height="210" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.4"/><text x="604" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14233A" text-anchor="start" font-weight="700">2 · Transform (dbt staging)</text><text x="604" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">type &amp; parse dates, numbers</text><text x="604" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">conform places → PSGC</text><text x="604" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">conform events, orgs, units</text><text x="604" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">de-duplicate</text><text x="604" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">45 DQ rules → dq_status</text><text x="604" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">valid/warning only go on</text><rect x="590" y="470" width="270" height="140" rx="8" fill="#FBE6DC" stroke="#E0612A" stroke-width="1.4"/><text x="604" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14233A" text-anchor="start" font-weight="700">Quarantine (dq)</text><text x="604" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">rejected rows + reasons</text><text x="604" y="539" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">issue log, scorecard</text><text x="604" y="558" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">reconciliation 19/19</text><line x1="725" y1="410" x2="725" y2="470" stroke="#E0612A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="735" y="446" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E0612A" text-anchor="start" font-style="italic">rejects</text><line x1="860" y1="305" x2="920" y2="305" stroke="#14233A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="920" y="200" width="250" height="210" rx="8" fill="#14233A" stroke="#14233A" stroke-width="1.4"/><text x="934" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#F6F4EF" text-anchor="start" font-weight="700">3 · Load (dw)</text><text x="934" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9D3DE" text-anchor="start">surrogate keys</text><text x="934" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9D3DE" text-anchor="start">SCD2 dim_location</text><text x="934" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9D3DE" text-anchor="start">(dated change log)</text><text x="934" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9D3DE" text-anchor="start">6 facts, 10 dims</text><text x="934" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9D3DE" text-anchor="start">PK / FK constraints</text><text x="934" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9D3DE" text-anchor="start">RLS + grants</text><line x1="1170" y1="305" x2="1220" y2="305" stroke="#14233A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1220" y="200" width="250" height="150" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.4"/><text x="1234" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14233A" text-anchor="start" font-weight="700">4 · Aggregate (mart)</text><text x="1234" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">8 materialized views</text><text x="1234" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">GROUP BY CUBE</text><text x="1234" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">GROUPING SETS</text><text x="1234" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">tested vs facts</text><line x1="1345" y1="350" x2="1345" y2="420" stroke="#14233A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1220" y="420" width="250" height="150" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.4"/><text x="1234" y="446" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14233A" text-anchor="start" font-weight="700">5 · Deliver</text><text x="1234" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">PHP API (XAMPP)</text><text x="1234" y="489" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">as driw_web (marts only)</text><text x="1234" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">JSON snapshot fallback</text><text x="1234" y="527" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">Next.js dashboards</text><rect x="920" y="470" width="250" height="140" rx="8" fill="#FCFBF8" stroke="#B8B2A3" stroke-width="1.4"/><text x="934" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14233A" text-anchor="start" font-weight="700">Validate</text><text x="934" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">117 dbt checks each build</text><text x="934" y="539" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">pytest: e2e, access, API</text><text x="934" y="558" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3E4A5A" text-anchor="start">query benchmark</text><text x="24" y="730" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6A7179" text-anchor="start">Full reload: raw is truncated and reloaded, dbt rebuilds staging, dw and marts; grants, row-level security and keys are re-applied on every build.</text></svg>